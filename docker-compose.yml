version: '3.8'

services:
  fitness-notifier:
    build: .
    container_name: smart_fitness_notifier
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TIMEZONE=Africa/Cairo
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./state.json:/app/state.json
      - ./custom_meals.json:/app/custom_meals.json
